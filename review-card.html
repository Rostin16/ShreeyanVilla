<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreeyan Villa - Luxury Review Standee Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <!-- html2canvas for 1-Click HD Image Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1B1917;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #333;
        }

        .action-panel {
            margin-bottom: 24px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 99px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #C29F68 100%);
            color: #0E0D0B;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(194, 159, 104, 0.4);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        /* Luxury Standee Card Dimensions (5x7 inch ratio) */
        .standee-card {
            width: 400px;
            min-height: 560px;
            background: linear-gradient(145deg, #14382D 0%, #0c231c 100%);
            border: 3px solid #C29F68;
            border-radius: 20px;
            padding: 36px 30px;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .inner-border {
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(194, 159, 104, 0.4);
            border-radius: 12px;
            pointer-events: none;
        }

        .logo-badge {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 2px solid #C29F68;
            background: #fff;
            object-fit: cover;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
            margin-bottom: 12px;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #fff;
            line-height: 1.2;
        }

        .title span {
            color: #C29F68;
        }

        .subtitle {
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            color: #D6BA90;
            margin-top: 4px;
            font-weight: 500;
        }

        .quote {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 0.98rem;
            color: #E8E2D5;
            margin: 14px 0 16px;
            line-height: 1.4;
        }

        .qr-frame {
            background: #fff;
            padding: 12px;
            border-radius: 14px;
            border: 2px solid #C29F68;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: inline-block;
        }

        .qr-frame img {
            width: 175px;
            height: 175px;
            display: block;
            border-radius: 4px;
        }

        .stars {
            color: #F59E0B;
            font-size: 1.35rem;
            letter-spacing: 4px;
            margin: 12px 0 6px;
        }

        .scan-note {
            font-size: 0.78rem;
            color: #E5DEC9;
            font-weight: 400;
            letter-spacing: 0.04em;
        }

        .tagline {
            font-size: 0.68rem;
            color: rgba(214, 186, 144, 0.75);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-top: 8px;
        }

        @media print {
            body {
                background: transparent;
                padding: 0;
            }

            .action-panel {
                display: none;
            }

            .standee-card {
                box-shadow: none;
                border-color: #C29F68;
            }
        }
    </style>
</head>

<body>

    <!-- Controls Panel -->
    <div class="action-panel">
        <button class="btn btn-gold" onclick="downloadPNG()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download HD Image (PNG)
        </button>
        <button class="btn btn-outline" onclick="window.print()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            Print 5x7 Card
        </button>
    </div>

    <!-- The Luxury Standee Card Element -->
    <div class="standee-card" id="cardToExport">
        <div class="inner-border"></div>

        <div>
            <img src="Images/ShreeyanVilla_LOGO.jpeg" alt="Shreeyan Villa Logo" class="logo-badge"
                onerror="this.style.display='none'">
            <h1 class="title">Shreeyan <span>Villa</span></h1>
            <p class="subtitle">Virpor Village, Surat</p>
            <p class="quote">“Loved your stay? Share your experience with us!”</p>
        </div>

        <!-- Your Generated QR Code -->
        <div class="qr-frame">
            <img src="Review_qr.png" alt="Scan to Review Shreeyan Villa">
        </div>

        <div>
            <div class="stars">★★★★★</div>
            <p class="scan-note">Point your camera to leave a 5-Star Review</p>
            <p class="tagline">Rate Us On Google</p>
        </div>
    </div>

    <script>
        function downloadPNG() {
            const card = document.getElementById('cardToExport');
            html2canvas(card, { scale: 3, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Shreeyan-Villa-Review-Card.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>

</html>
